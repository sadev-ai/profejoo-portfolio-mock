name: Deploy Profejoo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        working-directory: ./app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build React app for GitHub Pages
        working-directory: ./app
        env:
          VITE_MOCK_MODE: "true"
          VITE_DEFAULT_API_BASE_URL: "http://demo.local"
        run: npm run build

      - name: Install landing dependencies
        working-directory: ./landing
        run: npm install --no-audit --no-fund

      - name: Build Astro landing for GitHub Pages
        working-directory: ./landing
        env:
          PUBLIC_APP_URL: "/${{ github.event.repository.name }}/app/#"
        run: npm run build

      - name: Place React app inside the landing build
        run: |
          mkdir -p landing/dist/app
          cp -R app/dist/. landing/dist/app/
          touch landing/dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./landing/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
